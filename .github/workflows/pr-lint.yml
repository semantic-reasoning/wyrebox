name: PR Gates

# Configuration coverage:
# - pr-build and pr-sanitize require Cap'n Proto (-Dcapnp=enabled,
#   -Dcapnp_serialization=enabled), so wyreboxd, the Postfix helpers and
#   their process tests always build and run; a missing toolchain fails
#   meson setup instead of silently skipping them.
# - pr-build-minimal disables Cap'n Proto to keep the non-serialization
#   fallback configuration compiling and passing its tests.
# - main-ci.yml repeats the Cap'n Proto-enabled build on gcc and clang and the
#   sanitizer run on x86_64 and arm64; pr-sanitize runs the same matrix.
# - ubuntu-26-04-dovecot runs the full suite on the GitHub-hosted ubuntu-26.04
#   runner against the installed Dovecot 2.4.2 headers and the fixture bundle
#   (#354).

on:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Route C/C++ compiles through sccache backed by the GitHub Actions cache.
  SCCACHE_GHA_ENABLED: "true"

jobs:
  pr-lint:
    name: PR lint
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pinned Uncrustify
        run: |
          format_prefix="$RUNNER_TEMP/uncrustify"
          ./tools/install-uncrustify.sh "$format_prefix"
          echo "$format_prefix/bin" >> "$GITHUB_PATH"

      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --check "$BASE_SHA...HEAD"

      - name: Check changed C/H formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ./tools/check-format.sh --changed "$BASE_SHA"
  pr-build:
    name: PR build
    runs-on: ubuntu-24.04
    needs: pr-lint

    env:
      CC: sccache gcc
      CXX: sccache g++

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            capnproto \
            libcapnp-dev \
            libglib2.0-dev \
            meson \
            ninja-build \
            pkg-config \
            unzip

      - name: Configure
        run: |
          meson setup _build \
            -Dcapnp=enabled \
            -Dcapnp_serialization=enabled

      - name: Build
        run: |
          meson compile -C _build

      - name: Test
        run: |
          ./tools/ci-core-backtraces.sh enable "$RUNNER_TEMP/cores" ||
            echo "::warning::core dumps are not enabled"
          ulimit -c unlimited || ulimit -S -c "$(ulimit -H -c)" || true
          meson test -C _build --print-errorlogs

      - name: Print crash backtraces
        if: failure()
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends gdb || true
          ./tools/ci-core-backtraces.sh report "$RUNNER_TEMP/cores"

  pr-build-minimal:
    name: PR build (no Cap'n Proto)
    runs-on: ubuntu-24.04
    needs: pr-lint

    env:
      CC: sccache gcc
      CXX: sccache g++

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            libglib2.0-dev \
            meson \
            ninja-build \
            pkg-config \
            unzip

      - name: Configure
        run: |
          meson setup _build \
            -Dcapnp=disabled \
            -Dcapnp_serialization=disabled

      - name: Build
        run: |
          meson compile -C _build

      - name: Test
        run: |
          ./tools/ci-core-backtraces.sh enable "$RUNNER_TEMP/cores" ||
            echo "::warning::core dumps are not enabled"
          ulimit -c unlimited || ulimit -S -c "$(ulimit -H -c)" || true
          meson test -C _build --print-errorlogs

      - name: Print crash backtraces
        if: failure()
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends gdb || true
          ./tools/ci-core-backtraces.sh report "$RUNNER_TEMP/cores"

  pr-sanitize:
    name: PR sanitize (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: pr-build

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    env:
      CC: sccache gcc
      CXX: sccache g++
      ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
      # DuckDB version built from source on architectures without a prebuilt.
      DUCKDB_VERSION: v2.0.0
      DUCKDB_ROOT: ${{ github.workspace }}/duckdb-install

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            capnproto \
            cmake \
            git \
            libcapnp-dev \
            libglib2.0-dev \
            meson \
            ninja-build \
            pkg-config \
            unzip

      # arm64 has no bundled DuckDB prebuilt; build it from source and cache it
      # so it is compiled at most once per DuckDB version.
      - name: Cache source-built DuckDB
        if: matrix.arch == 'arm64'
        id: duckdb-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.DUCKDB_ROOT }}
          key: duckdb-${{ env.DUCKDB_VERSION }}-${{ matrix.arch }}

      - name: Build DuckDB from source
        if: matrix.arch == 'arm64' && steps.duckdb-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$DUCKDB_VERSION" \
            https://github.com/duckdb/duckdb.git duckdb-src
          CC=gcc CXX=g++ cmake -S duckdb-src -B duckdb-src/build \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_UNITTESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$DUCKDB_ROOT"
          cmake --build duckdb-src/build -j "$(nproc)"
          cmake --install duckdb-src/build

      - name: Configure
        run: |
          extra=()
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            extra+=("-Dduckdb_root=$DUCKDB_ROOT")
          fi
          meson setup _build \
            -Dcapnp=enabled \
            -Dcapnp_serialization=enabled \
            -Db_sanitize=address,undefined \
            -Db_lundef=false \
            "${extra[@]}"

      - name: Build
        run: |
          meson compile -C _build

      - name: Test
        run: |
          export LD_LIBRARY_PATH="$DUCKDB_ROOT/lib:${LD_LIBRARY_PATH:-}"
          # Sanitizer-instrumented runs are several times slower than a normal
          # build; on the arm64 runner the derived-view-materializer suite
          # exceeds Meson's default 30s per-test limit. Scale all test timeouts
          # so slow-but-progressing tests are not killed prematurely.
          meson test -C _build --timeout-multiplier 6 --print-errorlogs

  ubuntu-26-04-dovecot:
    name: Ubuntu 26.04 Dovecot 2.4.2
    runs-on: ubuntu-26.04
    needs: pr-lint

    env:
      CC: sccache gcc
      CXX: sccache g++

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install build dependencies
        run: |
          echo "postfix postfix/main_mailer_type select No configuration" \
            | sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            build-essential \
            ca-certificates \
            capnproto \
            dovecot-dev \
            dovecot-imapd \
            libcapnp-dev \
            libglib2.0-dev \
            meson \
            ninja-build \
            pkg-config \
            postfix \
            unzip

      - name: Configure (system Dovecot)
        run: |
          meson setup _build-system \
            -Dcapnp=enabled \
            -Dcapnp_serialization=enabled \
            -Ddovecot_backend=enabled \
            -Ddovecot_config=/usr/lib/dovecot/dovecot-config

      - name: Build (system Dovecot)
        run: |
          meson compile -C _build-system

      - name: Test (system Dovecot)
        run: |
          meson test -C _build-system --print-errorlogs

      - name: Configure (fixture Dovecot)
        run: |
          meson setup _build-fixture \
            -Dcapnp=enabled \
            -Dcapnp_serialization=enabled \
            -Ddovecot_backend=enabled \
            -Ddovecot_source_dir=tests/dovecot/fixtures/valid-2.4.2 \
            -Ddovecot_build_dir=tests/dovecot/fixtures/valid-2.4.2/build-config-valid

      - name: Build (fixture Dovecot)
        run: |
          meson compile -C _build-fixture

      - name: Test (fixture Dovecot)
        run: |
          meson test -C _build-fixture --print-errorlogs
