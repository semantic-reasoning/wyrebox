name: PR Gates

# Configuration coverage:
# - pr-build and pr-sanitize require Cap'n Proto (-Dcapnp=enabled,
#   -Dcapnp_serialization=enabled), so wyreboxd, the Postfix helpers and
#   their process tests always build and run; a missing toolchain fails
#   meson setup instead of silently skipping them.
# - pr-build-minimal disables Cap'n Proto to keep the non-serialization
#   fallback configuration compiling and passing its tests.
# - main-ci.yml repeats the Cap'n Proto-enabled build on gcc and clang and the
#   sanitizer run on x86_64 and arm64.

on:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  pr-lint:
    name: PR lint
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pinned Uncrustify
        run: |
          format_prefix="$RUNNER_TEMP/uncrustify"
          ./tools/install-uncrustify.sh "$format_prefix"
          echo "$format_prefix/bin" >> "$GITHUB_PATH"

      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --check "$BASE_SHA...HEAD"

      - name: Check changed C/H formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ./tools/check-format.sh --changed "$BASE_SHA"
  pr-build:
    name: PR build
    runs-on: ubuntu-24.04
    needs: pr-lint

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            capnproto \
            libcapnp-dev \
            libglib2.0-dev \
            meson \
            ninja-build \
            pkg-config \
            unzip

      - name: Configure
        run: |
          meson setup _build \
            -Dcapnp=enabled \
            -Dcapnp_serialization=enabled

      - name: Build
        run: |
          meson compile -C _build

      - name: Test
        run: |
          meson test -C _build --print-errorlogs

  pr-build-minimal:
    name: PR build (no Cap'n Proto)
    runs-on: ubuntu-24.04
    needs: pr-lint

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            libglib2.0-dev \
            meson \
            ninja-build \
            pkg-config \
            unzip

      - name: Configure
        run: |
          meson setup _build \
            -Dcapnp=disabled \
            -Dcapnp_serialization=disabled

      - name: Build
        run: |
          meson compile -C _build

      - name: Test
        run: |
          meson test -C _build --print-errorlogs

  pr-sanitize:
    name: PR sanitize
    runs-on: ubuntu-24.04
    needs: pr-build

    env:
      ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            capnproto \
            libcapnp-dev \
            libglib2.0-dev \
            meson \
            ninja-build \
            pkg-config \
            unzip

      - name: Configure
        run: |
          meson setup _build \
            -Dcapnp=enabled \
            -Dcapnp_serialization=enabled \
            -Db_sanitize=address,undefined \
            -Db_lundef=false

      - name: Build
        run: |
          meson compile -C _build

      - name: Test
        run: |
          # Sanitizer-instrumented runs are several times slower; match the
          # main sanitize job so slow-but-progressing tests are not killed.
          meson test -C _build --timeout-multiplier 6 --print-errorlogs
