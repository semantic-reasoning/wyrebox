[daemon]
socket_path=/run/wyrebox/wyrebox.sock
journal_root_dir=/var/lib/wyrebox/journal
object_root_dir=/var/lib/wyrebox/object-store
catalog_path=/var/lib/wyrebox/catalog.duckdb

[wirelog]
rules_path=/etc/wyrebox/views.dl
extraction_rules_path=/etc/wyrebox/extraction.rules

[view:projects]
imap_name=Projects
scope=message
